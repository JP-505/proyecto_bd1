<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
    <div class="tarjeta">
        <form id="contact-form" action="https://proyecto-bd1.onrender.com/contacto" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Escribe tu nombre" required>
            <br><br>
            <label for="correo">Correo</label>
            <input type="email" name="correo" id="correo" placeholder="Escribe tu correo" required>
            <br><br>
            <label for="asunto">Asunto</label>
            <input type="text" name="asunto" id="asunto" placeholder="Ej: Consulta sobre un producto" required>
            <br><br>
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" rows="5" required></textarea>
            <br><br>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>

    <section class="panel-mensajes">
        <div class="panel-header">
            <h2>Mensajes recibidos</h2>
            <button id="btnActualizarMensajes" class="btn btn-small" type="button">Actualizar</button>
        </div>
        <div id="listaMensajes" class="lista-mensajes">
            <p class="mensaje-vacio">Cargando mensajes...</p>
        </div>
    </section>

<script>
  const API_URL = 'https://proyecto-bd1.onrender.com';
  const form = document.getElementById('contact-form');
  const listaMensajes = document.getElementById('listaMensajes');
  const btnActualizarMensajes = document.getElementById('btnActualizarMensajes');

  async function cargarMensajes() {
    if (!listaMensajes) return;

    try {
      const respuesta = await fetch(`${API_URL}/contacto`);
      const data = await respuesta.json();

      if (!respuesta.ok) {
        throw new Error(data.mensaje || 'No se pudieron cargar los mensajes');
      }

      if (!Array.isArray(data)) {
        throw new Error('El servidor devolvió una respuesta inesperada');
      }

      if (data.length === 0) {
        listaMensajes.innerHTML = '<p class="mensaje-vacio">Aún no hay mensajes recibidos.</p>';
        return;
      }

      listaMensajes.replaceChildren();
      data.forEach((mensaje) => {
        const articulo = document.createElement('article');
        articulo.className = 'mensaje-item';

        const cabecera = document.createElement('div');
        cabecera.className = 'mensaje-topo';

        const nombre = document.createElement('strong');
        nombre.textContent = mensaje.nombre;

        const fecha = document.createElement('span');
        fecha.textContent = mensaje.fecha
          ? new Date(mensaje.fecha).toLocaleString('es-ES')
          : '';

        const correo = document.createElement('p');
        correo.className = 'mensaje-mail';
        correo.textContent = mensaje.correo;

        const asunto = document.createElement('p');
        asunto.className = 'mensaje-asunto';
        asunto.textContent = mensaje.asunto;

        const texto = document.createElement('p');
        texto.className = 'mensaje-cuerpo';
        texto.textContent = mensaje.mensaje;

        const acciones = document.createElement('div');
        acciones.className = 'mensaje-acciones';

        const btnEliminar = document.createElement('button');
        btnEliminar.type = 'button';
        btnEliminar.className = 'btn btn-small btn-eliminar';
        btnEliminar.textContent = 'Eliminar';
        btnEliminar.addEventListener('click', () => eliminarMensaje(mensaje.id, btnEliminar));

        acciones.appendChild(btnEliminar);
        cabecera.append(nombre, fecha);
        articulo.append(cabecera, correo, asunto, texto, acciones);
        listaMensajes.appendChild(articulo);
      });
    } catch (error) {
      console.error('Error al cargar mensajes:', error);
      listaMensajes.innerHTML = '<p class="mensaje-vacio">No se pudieron cargar los mensajes.</p>';
    }
  }

  if (form) {
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = {
        nombre: document.getElementById('nombre').value,
        correo: document.getElementById('correo').value,
        asunto: document.getElementById('asunto').value,
        mensaje: document.getElementById('mensaje').value
      };

      try {
        const respuesta = await fetch(`${API_URL}/contacto`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(resultado.mensaje || 'No se pudo enviar el mensaje');
        }

        alert(resultado.mensaje || '¡Mensaje enviado correctamente!');
        form.reset();
        await cargarMensajes();
      } catch (error) {
        console.error('Error al enviar mensaje:', error);
        alert(error.message || 'No se pudo conectar con el servidor.');
      }
    });
  }

  async function eliminarMensaje(id, boton) {
    if (!confirm('¿Seguro que deseas eliminar este mensaje? Esta acción no se puede deshacer.')) {
      return;
    }

    boton.disabled = true;

    try {
      const respuesta = await fetch(`${API_URL}/contacto/${encodeURIComponent(id)}`, {
        method: 'DELETE'
      });

      let resultado;
      try {
        resultado = await respuesta.json();
      } catch {
        throw new Error('El servidor devolvió una respuesta inválida al eliminar el mensaje.');
      }

      if (!respuesta.ok) {
        throw new Error(resultado.mensaje || `No se pudo eliminar el mensaje (HTTP ${respuesta.status}).`);
      }

      await cargarMensajes();
    } catch (error) {
      console.error('Error al eliminar mensaje:', error);
      alert(error.message || 'No se pudo conectar con el servidor.');
      boton.disabled = false;
    }
  }

  if (btnActualizarMensajes) {
    btnActualizarMensajes.addEventListener('click', cargarMensajes);
  }

  cargarMensajes();
</script>

    <footer>
        <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </footer>
    
</body>
</html>
