<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos</title>
    <link rel="stylesheet" href="contacto.css">
</head>
<body>
    <header class="navbar">
    <div class="contenedor nav-contenido">
      <a href="index.html" class="logo"> Mi<strong>Tienda</strong></a>
      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="index.html">Productos</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
  </header>
    <div class="tarjeta">
        <form id="contact-form" action="https://proyecto-bd1.onrender.com" method="POST">
            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" placeholder="Escribe tu nombre" required>
            <br><br>
            <label for="correo">Correo</label>
            <input type="email" name="correo" id="correo" placeholder="Escribe tu correo" required>
            <br><br>
            <label for="asunto">Asunto</label>
            <input type="text" name="asunto" id="asunto" placeholder="Ej: Consulta sobre un producto" required>
            <br><br>
            <label for="mensaje">Mensaje</label>
            <textarea name="mensaje" id="mensaje" rows="5" required></textarea>
            <br><br>
            <button type="submit" class="btn">Enviar</button>
        </form>
    </div>

    <section class="panel-mensajes">
        <div class="panel-header">
            <h2>Mensajes recibidos</h2>
            <button id="btnActualizarMensajes" class="btn btn-small" type="button">Actualizar</button>
        </div>
        <div id="listaMensajes" class="lista-mensajes">
            <p class="mensaje-vacio">Cargando mensajes...</p>
        </div>
    </section>

<script>
  const form = document.getElementById('contact-form');
  const listaMensajes = document.getElementById('listaMensajes');
  const btnActualizarMensajes = document.getElementById('btnActualizarMensajes');

  async function cargarMensajes() {
    if (!listaMensajes) return;

    try {
      const respuesta = await fetch('http://localhost:3000/mensajes');
      const data = await respuesta.json();

      if (!respuesta.ok || !data.exito) {
        throw new Error(data.mensaje || 'No se pudieron cargar los mensajes');
      }

      const mensajes = data.mensajes || [];

      if (mensajes.length === 0) {
        listaMensajes.innerHTML = '<p class="mensaje-vacio">Aún no hay mensajes recibidos.</p>';
        return;
      }

      listaMensajes.innerHTML = mensajes.map((mensaje) => `
        <article class="mensaje-item">
          <div class="mensaje-topo">
            <strong>${mensaje.nombre}</strong>
            <span>${new Date(mensaje.fecha).toLocaleString('es-ES')}</span>
          </div>
          <p class="mensaje-mail">${mensaje.correo}</p>
          <p class="mensaje-asunto">${mensaje.asunto}</p>
          <p class="mensaje-cuerpo">${mensaje.mensaje}</p>
        </article>
      `).join('');
    } catch (error) {
      console.error('Error al cargar mensajes:', error);
      listaMensajes.innerHTML = '<p class="mensaje-vacio">No se pudieron cargar los mensajes.</p>';
    }
  }

  if (form) {
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const formData = {
        nombre: document.getElementById('nombre').value,
        correo: document.getElementById('correo').value,
        asunto: document.getElementById('asunto').value,
        mensaje: document.getElementById('mensaje').value
      };

      try {
        const respuesta = await fetch('http://localhost:3000/enviar-mensaje', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const resultado = await respuesta.json();

        if (resultado.exito) {
          alert('¡Mensaje guardado correctamente en la base de datos!');
          form.reset();
          await cargarMensajes();
        } else {
          alert('Error: ' + resultado.mensaje);
        }
      } catch (error) {
        console.error('Error de red:', error);
        alert('No se pudo conectar con el servidor.');
      }
    });
  }

  if (btnActualizarMensajes) {
    btnActualizarMensajes.addEventListener('click', cargarMensajes);
  }

  cargarMensajes();
</script>

    </div>

    <footer>
        <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
    </footer>
    
</body>
</html>
